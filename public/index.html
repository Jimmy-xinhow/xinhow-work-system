<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><script src="/shim.js"></script></head><body>
<title>星昊工作管理系統</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sticky top bar with 3 areas (客戶 / 帳款 / 待辦); client list as scannable rows under status tabs; client detail slides in as a right-hand panel; renew/close/edit happen in a centered modal. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --ink:#16202F; --muted:#5B6678; --line:#DCE1EA;
  --accent:#1F3864; --accent-ink:#FFFFFF; --accent-soft:#E5EBF6;
  --ok:#1D7448; --ok-soft:#E2F2E9; --warn:#8F5600; --warn-soft:#FFF0D2; --bad:#B3261E; --bad-soft:#FBE3E1;
  --shade:rgba(15,21,32,.45);
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1420; --surface:#172030; --ink:#E7ECF4; --muted:#9BA8BC; --line:#2A3649;
  --accent:#9DBBF2; --accent-ink:#0E1420; --accent-soft:#223048;
  --ok:#6FD0A0; --ok-soft:#16372A; --warn:#F0B95A; --warn-soft:#3A2C10; --bad:#F2958E; --bad-soft:#3F1F1D;
  --shade:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1420; --surface:#172030; --ink:#E7ECF4; --muted:#9BA8BC; --line:#2A3649;
  --accent:#9DBBF2; --accent-ink:#0E1420; --accent-soft:#223048;
  --ok:#6FD0A0; --ok-soft:#16372A; --warn:#F0B95A; --warn-soft:#3A2C10; --bad:#F2958E; --bad-soft:#3F1F1D;
  --shade:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-sans);font-size:14px;line-height:1.55;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.wrap{max-width:1180px;margin:0 auto}
/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);margin:0 calc(-1*max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.top .wrap{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;padding-bottom:10px;letter-spacing:.02em}
.brand small{display:block;font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.08em}
.nav{display:flex;gap:2px;overflow-x:auto}
@media (max-width:640px){.nav{flex-wrap:wrap;overflow:visible;width:100%}.nav button{padding:8px 10px}.brand{padding-bottom:0}}
.nav button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.nav button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
.nav .count{font-family:var(--f-mono);font-size:11px;margin-left:6px;padding:1px 6px;border-radius:9px;background:var(--bad-soft);color:var(--bad)}
main{padding-block:18px 60px}
/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,.nav button:focus-visible,.crow:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{color:var(--warn);border-color:var(--warn)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--accent)}
.btn[disabled]{opacity:.5;cursor:default}
/* notices */
.note{border:1px solid var(--line);border-left-width:4px;border-radius:6px;background:var(--surface);padding:10px 14px;margin-bottom:14px;display:flex;gap:12px;align-items:flex-start}
.note.bad{border-left-color:var(--bad)} .note.warn{border-left-color:var(--warn)}
.note > div{flex:1;min-width:0}
/* summary + toolbar */
.sumline{display:flex;gap:22px;flex-wrap:wrap;margin:0 0 14px;color:var(--muted)}
.sumline b{color:var(--ink);font-size:18px;font-weight:700;margin-right:4px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 14px;cursor:pointer;font-weight:500}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tabs .n{font-family:var(--f-mono);font-size:11.5px;margin-left:6px;opacity:.8}
.grow{flex:1}
input[type=search],input[type=text],input[type=date],input[type=number],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 10px;width:100%}
.tools input[type=search]{max-width:240px}
textarea{min-height:84px;resize:vertical}
/* client rows */
.list{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,.8fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.list .crow:first-child{border-top:0}
.crow:hover{background:var(--accent-soft)}
.crow .nm{font-weight:700} .crow .full{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .code{font-size:12px;color:var(--muted);margin-right:6px}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{font-size:12px;padding:1px 8px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;font-size:12px;font-weight:500;padding:1px 9px;border-radius:999px;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.pill.mute{background:transparent;border-color:var(--line);color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.acts{display:flex;gap:6px;justify-content:flex-end}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
@media (max-width:820px){
  .crow{grid-template-columns:minmax(0,1fr) auto;gap:8px}
  .crow > :nth-child(3),.crow > :nth-child(4){grid-column:1 / -1}
  .acts{grid-column:1 / -1;justify-content:flex-start}
}
/* detail panel */
.shade{position:fixed;inset:0;background:var(--shade);z-index:20}
.panel{position:fixed;top:0;right:0;bottom:0;width:min(760px,100%);background:var(--bg);z-index:21;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.18);padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) 0}
.phead{position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;z-index:2}
.phead h2{margin:0;font-size:19px;flex:1;min-width:180px}
.pbody{padding:16px 20px 40px;display:flex;flex-direction:column;gap:18px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.sec > header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.sec > header h3{margin:0;font-size:14px;flex:1}
.sec .in{padding:12px 14px}
dl.kv{display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:6px 12px;margin:0}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;overflow-wrap:anywhere}
.item{padding:10px 14px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:flex-start}
.item:first-of-type{border-top:0}
.item > .main{flex:1;min-width:0}
.item .title{font-weight:500;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item .sub{color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.cf{background:var(--warn-soft);border:1px solid var(--warn);border-radius:6px;padding:8px 12px;display:flex;gap:10px;align-items:flex-start;margin-bottom:8px;color:var(--ink)}
.cf > div{flex:1;min-width:0;font-size:13px}
.warnmark{color:var(--warn);font-size:12px}
.tl{list-style:none;margin:0;padding:0}
.tl li{padding:7px 14px;border-top:1px solid var(--line);font-size:13px;display:flex;gap:10px}
.tl li:first-child{border-top:0}
.tl time{color:var(--muted);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
/* modal */
.mwrap{position:fixed;inset:0;background:var(--shade);z-index:40;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:max(20px,env(safe-area-inset-top,0px)) 12px 30px}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);box-shadow:0 12px 40px rgba(0,0,0,.25);margin-top:6vh}
.modal h3{margin:0;padding:14px 18px;border-bottom:1px solid var(--line);font-size:16px}
.modal form{padding:14px 18px 6px;display:grid;gap:12px}
.fld label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:3px}
.fld .hint{font-size:12px;color:var(--muted);margin-top:3px}
.fld.req label::after{content:" *";color:var(--bad)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:520px){.two{grid-template-columns:1fr}}
.infobox{background:var(--accent-soft);border-radius:6px;padding:9px 12px;font-size:13px}
.infobox.warn{background:var(--warn-soft)}
.mfoot{display:flex;gap:8px;justify-content:flex-end;padding:12px 18px 16px;border-top:1px solid var(--line);margin-top:6px;flex-wrap:wrap}
.mfoot .left{margin-right:auto}
.err{color:var(--bad);font-size:13px;min-height:1em;padding:0 18px}
.carry{display:grid;grid-template-columns:auto minmax(0,1fr) 120px;gap:8px 10px;align-items:center}
.carry .lab{font-size:13px;overflow-wrap:anywhere}
/* tables (bills) */
.tablewrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:860px}
th,td{padding:9px 12px;text-align:left;border-top:1px solid var(--line);vertical-align:middle}
thead th{border-top:0;font-size:12.5px;color:var(--muted);font-weight:500;background:var(--bg)}
td.r,th.r{text-align:right}
/* todos */
.todo{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-start}
.list > .todo:first-child{border-top:0}
.todo.done .tt{text-decoration:line-through;color:var(--muted)}
.todo input[type=checkbox]{margin-top:4px;width:17px;height:17px}
#toastroot{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;max-width:90%;pointer-events:none}
.toast{background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:8px}
@media (prefers-reduced-motion:no-preference){.panel{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:0}}}

/* v2 */
:root{--c-todo:#C3CAD6;--c-doing:#7C9AD6;--c-wait:#E3A93C;--c-back:#D9534F;--c-acc:#5DB886;--c-done:#1D7448}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--c-todo:#3C4960;--c-doing:#5E80C6;--c-wait:#C98E26;--c-back:#D9625C;--c-acc:#4CA374;--c-done:#6FD0A0}}
:root[data-theme="dark"]{--c-todo:#3C4960;--c-doing:#5E80C6;--c-wait:#C98E26;--c-back:#D9625C;--c-acc:#4CA374;--c-done:#6FD0A0}
.pill.done{background:var(--ok);color:var(--surface)}
.pbar{display:flex;align-items:center;gap:8px}
.seg{display:flex;height:12px;border-radius:6px;overflow:hidden;background:var(--line);gap:2px}
.seg i{display:block;min-width:4px}
.bighead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
.big{font-size:34px;font-weight:700;margin-right:6px}
.legends{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.legend{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}
.legend b{font-weight:500;margin-left:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;border-top:1px solid var(--line);padding-top:12px}
.kpis div{display:flex;flex-direction:column}.kpis b{font-size:20px}.kpis span{color:var(--muted);font-size:12.5px}
.two-col{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:16px;margin-bottom:16px}
.two-col .sec{margin:0}
.sec{margin-bottom:16px}
.pbody .sec{margin-bottom:0}
.qrow{display:flex;gap:12px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer}
.qrow:first-of-type{border-top:0}.qrow:hover{background:var(--accent-soft)}.qrow .sub{font-size:12.5px}
tr.click{cursor:pointer}tr.click:hover{background:var(--accent-soft)}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr) auto minmax(0,.9fr) auto;gap:14px;align-items:center;padding:12px 16px;border-top:1px solid var(--line);cursor:pointer}
.list .trow:first-child{border-top:0}.trow:hover{background:var(--accent-soft)}
.fold>summary{cursor:pointer;padding:12px 16px;font-weight:600;font-size:14px}.fold[open]>summary{border-bottom:1px solid var(--line)}.grp{border-top:1px solid var(--line)}.list .grp:first-child{border-top:0}.grp .grp-head{border-top:0}.grp-body{background:var(--accent-soft);border-top:1px solid var(--line)}.grp-body .trow{padding-left:34px}.grp-head .chev{display:inline-block;width:16px;color:var(--muted)}.trow .code{font-size:12px;color:var(--muted);margin-right:6px}.trow .sub{font-size:12.5px}
.mini{height:6px;background:var(--line);border-radius:3px;margin-top:5px;overflow:hidden}.mini i{display:block;height:100%;background:var(--accent)}
@media (max-width:820px){.trow{grid-template-columns:minmax(0,1fr) auto;gap:8px}.trow > :nth-child(2),.trow > :nth-child(3){grid-column:auto}.trow > :nth-child(5){display:none}}
.chks{display:flex;flex-direction:column;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;cursor:pointer}.chk input{margin-top:4px;width:17px;height:17px}
.counter{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.counter input{width:96px;text-align:center;font-size:18px}
.addlink{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-top:1px solid var(--line)}
.chkrow{display:flex;flex-direction:column;gap:8px}
.item .pill{flex:none;align-self:flex-start;margin-top:2px}
.stickybar{position:sticky;bottom:0;z-index:3;display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 20px;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 16px rgba(0,0,0,.08)}
.steps{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.steps li{padding:4px 12px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:13px}
.steps li.done{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.steps li.done::before{content:'✓ '}
.steps li.cur{border-color:var(--accent);color:var(--accent);font-weight:500}
.olist{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:6px}

/* v3 responsive：平板與手機 */
html{-webkit-text-size-adjust:100%}
.tablewrap{-webkit-overflow-scrolling:touch}
@media (max-width:820px){
  input[type=search],input[type=text],input[type=date],input[type=number],select,textarea{font-size:16px}
  .panel{width:100%}
  .phead{padding:12px 14px}.phead h2{font-size:17px;min-width:100%}
  .pbody{padding:12px 14px 40px;gap:14px}
  .stickybar{padding:10px 14px}
  .trow{grid-template-columns:minmax(0,1fr) auto;gap:6px 10px;padding:13px 14px}
  .trow > :nth-child(1){grid-column:1;grid-row:1}
  .trow > :nth-child(4){grid-column:2;grid-row:1;align-items:flex-end;text-align:right}
  .trow > :nth-child(2){grid-column:1 / -1;grid-row:2}
  .trow > :nth-child(3),.trow > :nth-child(5){display:none}
  .grp-body .trow{padding-left:22px}
  dl.kv{grid-template-columns:6em minmax(0,1fr)}
}
@media (max-width:640px){
  body{font-size:15px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px))}
  .top{margin:0 calc(-1*max(12px,env(safe-area-inset-left,0px)));padding:8px max(12px,env(safe-area-inset-right,0px)) 0 max(12px,env(safe-area-inset-left,0px))}
  .top .wrap{gap:0 10px;align-items:center}
  .brand{order:1;padding:0 0 6px;font-size:15px}.brand small{display:none}
  .top .acct{order:2;margin:0 0 6px auto!important;gap:4px!important;flex-wrap:nowrap!important}
  .nav{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -12px;padding:0 12px}
  .nav::-webkit-scrollbar{display:none}
  .nav button{flex:none;padding:11px 13px}
  main{padding-block:14px 80px}
  .tools{gap:8px}
  .tools input[type=search]{max-width:none;flex:1 1 100%}
  .tools > .tabs{flex:1 1 100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .tools > .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none}
  .sumline{gap:10px 16px}
  .crow{padding:13px 14px}
  .list,.sec,.tablewrap{border-radius:10px}
  .mwrap{padding:0;align-items:flex-end}
  .modal{width:100%;margin-top:0;border-radius:16px 16px 0 0;max-height:92vh;max-height:92dvh;overflow-y:auto}
  .modal form{padding:14px 14px 6px}.modal h3{padding:14px}
  .mfoot{position:sticky;bottom:0;background:var(--surface);padding:12px 14px max(14px,env(safe-area-inset-bottom,0px))}
  .mfoot .btn{flex:1 1 0;min-height:44px}
  .mfoot .left{flex:1 1 100%;margin-right:0;order:3}
  .stickybar .btn{flex:1 1 auto}
  .counter input{width:84px}
  .two-col{grid-template-columns:1fr}
  .big{font-size:30px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  #toastroot{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
}
@media (pointer:coarse){
  .btn{min-height:40px;padding:8px 14px}.btn.sm{min-height:36px;padding:6px 11px}
  .tabs button{min-height:38px}.legend{min-height:34px}
  .chk input,.todo input[type=checkbox]{width:22px;height:22px;margin-top:2px}
  .chk{padding:4px 0}
  .qrow,.item{padding-top:12px;padding-bottom:12px}
}

/* 員工總覽 */
.mrow{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:13px 16px;border-top:1px solid var(--line);cursor:pointer}
.sec > header + .mrow,.fold > summary + .mrow{border-top:0}
.mrow:hover{background:var(--accent-soft)}
.mmain{min-width:0;display:flex;flex-direction:column;gap:2px}.mmain .sub{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.mside{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;font-size:12.5px}
.ov{display:flex;flex-direction:column;gap:12px}
.ovtop{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}

<div id="toastroot"></div>

<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const p2=n=>String(n).padStart(2,'0');
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())};
const toUTC=s=>{const [y,m,d]=s.split('-').map(Number);return Date.UTC(y,m-1,d)};
const diffDays=(a,b)=>Math.round((toUTC(a)-toUTC(b))/864e5);
const addDays=(s,n)=>new Date(toUTC(s)+n*864e5).toISOString().slice(0,10);
const addYearMinusDay=s=>{const [y,m,d]=s.split('-').map(Number);return addDays(new Date(Date.UTC(y+1,m-1,d)).toISOString().slice(0,10),-1)};
const money=n=>(n==null||n==='')?'—':'NT$ '+Math.round(n).toLocaleString('en-US');
const safeUrl=u=>/^https?:\/\//i.test(u||'')?u:null;
const link=(u,t)=>{const s=safeUrl(u);return s?`<a href="${esc(s)}" target="_blank" rel="noopener">${esc(t||u)}</a>`:'—'};
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

const COLS=['clients','contacts','assets','contracts','services','fees','bills','log','todos','tasks','accept','sops','settings','notify','channels','plans'];
const S={};COLS.forEach(c=>S[c]={});
const loaded={};
let db=null,isAdmin=false,canWrite=true;
let view='dash',tab=null,query='',openCode=null,billFilter='open';
let renderQueued=false;

const STATUS_PILL={'進行中':'ok','暫停':'warn','洽談中':'info','結案':'mute'};
const CLOSE_REASONS=['合約到期未續約','客戶提前終止','專案完成','我方終止','其他'];
const SERVICE_TYPES=['SEO','GEO','內容行銷','LINE OA 管理','網站系統開發','網站維護'];
const ASSET_TYPES=['網站後台','GA4','GSC','GBP','LINE OA','廣告帳號','網域與主機','其他'];

/* ---------- derived data ---------- */
const rows=(coll,code)=>Object.entries(S[coll]).filter(([,v])=>v.clientCode===code).map(([id,v])=>Object.assign({id},v));
function info(code){
  const c=S.clients[code];
  const contracts=rows('contracts',code).sort((a,b)=>(b.end||b.start||'').localeCompare(a.end||a.start||''));
  const act=contracts.filter(k=>k.status==='有效'&&k.end);
  const latestEnd=act.reduce((m,k)=>k.end>m?k.end:m,'');
  const services=rows('services',code);
  const today=todayStr();
  const days=latestEnd?diffDays(latestEnd,today):null;
  const live=c.status==='進行中'||c.status==='暫停';
  const auto=act.find(k=>k.end===latestEnd);
  const needs=live&&days!=null&&days<=45;
  return {c,contracts,act,latestEnd,days,services,needs,auto:auto&&auto.autoRenew};
}
function monthlyOf(svc){
  if(svc.status!=='進行中'||svc.mode==='專案')return 0;
  const f=S.fees[svc.id];if(!f||f.amount==null)return 0;
  return svc.cycle==='月繳'?f.amount:svc.cycle==='年繳'?f.amount/12:svc.cycle==='季繳'?f.amount/3:0;
}
function mrr(){
  let t=0;
  Object.entries(S.services).forEach(([id,s])=>{const c=S.clients[s.clientCode];if(c&&c.status==='進行中')t+=monthlyOf(Object.assign({id},s))});
  return t;
}
const TABS=[['action','需處理'],['active','進行中'],['pending','待分類'],['closed','已結案'],['all','全部']];
function inTab(i,t){
  const st=i.c.status;
  if(t==='action')return i.needs;
  if(t==='active')return st==='進行中'||st==='暫停';
  if(t==='pending')return !st||st==='洽談中';
  if(t==='closed')return st==='結案';
  return true;
}

/* ---------- db helpers ---------- */
const ref=(coll,id)=>db.collection(coll).doc(id);
async function setDoc(coll,id,data){await ref(coll,id).set(data)}
async function upd(coll,id,data){await ref(coll,id).update(data)}
async function del(coll,id){await ref(coll,id).delete()}
function newId(coll){return db.collection(coll).doc().id}
async function addLog(code,action,note){
  await db.collection('log').add({at:new Date().toISOString(),clientCode:code,action,note:note||''});
}
function toast(msg){
  const el=document.createElement('div');el.className='toast';el.textContent=msg;
  $('#toastroot').appendChild(el);setTimeout(()=>el.remove(),3200);
}
async function run(fn,okMsg){
  try{await fn();if(okMsg)toast(okMsg);return true}
  catch(e){toast('儲存失敗：'+((e&&e.message)||e));return false}
}
function nextCode(){
  const n=Object.keys(S.clients).map(k=>parseInt(k.slice(1),10)).filter(x=>!isNaN(x));
  return 'C'+String((n.length?Math.max(...n):0)+1).padStart(3,'0');
}
function nextContractNo(code){
  let n=rows('contracts',code).length+1,no;
  do{no=code+'-'+p2(n++)}while(S.contracts[no]);
  return no;
}

/* ---------- rendering ---------- */
function queue(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;render()})}
function render(){
  if(!isAdmin&&view==='mine')view='board';
  if(isWorker()&&!['dash','board','sop','todos'].includes(view)){view='dash';openCode=null}
  renderNav();
  if(view==='dash')(isAdmin?renderDash:renderMyDash)();
  else if(view==='board')renderBoard(false);
  else if(view==='mine')renderBoard(true);
  else if(view==='clients')renderClients();
  else if(view==='bills')renderBills();
  else if(view==='sop')renderSop();
  else if(view==='notify')renderNotify();
  else renderTodos();
  renderPanel();
}
function actionCount(){return Object.keys(S.clients).filter(k=>info(k).needs).length}
function renderNav(){
  /* 管理者：全部；員工：沒有帳款、沒有「我的工作」（工作交付就只有自己的）；僅交付：只有工作交付、SOP、待辦 */
  const items=isWorker()?[['dash','總覽'],['board','工作交付'],['sop','SOP'],['todos','待辦']]
    :isAdmin?[['dash','總覽'],['board','工作交付'],['mine','我的工作'],['clients','客戶'],['bills','帳款'],['notify','通知'],['sop','SOP'],['todos','待辦']]
    :[['dash','總覽'],['board','工作交付'],['clients','客戶'],['notify','通知'],['sop','SOP'],['todos','待辦']];
  const n=actionCount();
  const tl=taskList();
  const bn=isAdmin?tl.filter(t=>t.state==='待驗收').length:tl.filter(t=>t.state==='退回').length;
  const cnt=k=>k==='clients'?n:k==='board'?bn:k==='mine'?tl.filter(t=>isMine(t)&&(t.state==='退回'||t.late)).length:k==='notify'?computeAlerts().length:0;
  const btn=([k,t])=>{const c=cnt(k);return `<button data-act="nav" data-v="${k}" ${view===k?'aria-current="page"':''}>${t}${c?`<span class="count">${c}</span>`:''}</button>`};
  const phone=window.matchMedia&&matchMedia('(max-width:640px)').matches;
  if(phone&&items.length>5){
    const main=items.slice(0,4),rest=items.slice(4);
    const restOn=rest.some(([k])=>k===view),restN=rest.reduce((m,[k])=>m+cnt(k),0);
    $('#nav').innerHTML=main.map(btn).join('')+`<button data-act="more" ${restOn?'aria-current="page"':''}>更多${restN?`<span class="count">${restN}</span>`:''}</button>`+(moreOpen?`<div class="moresheet">${rest.map(btn).join('')}</div>`:'');
  }else $('#nav').innerHTML=items.map(btn).join('');
}
let moreOpen=false;
if(window.matchMedia)matchMedia('(max-width:640px)').addEventListener('change',()=>{moreOpen=false;queue()});
function deadlinePill(i){
  const st=i.c.status;
  if(st==='結案')return `<span class="pill mute">${i.c.closedAt?'結案 '+esc(i.c.closedAt):'已結案'}</span>`;
  if(i.days==null)return `<span class="pill mute">無合約期限</span>`;
  const auto=i.auto?'・約定自動續約':'';
  if(i.days<0)return `<span class="pill bad">已過期 ${-i.days} 天${auto}</span>`;
  if(i.days<=45)return `<span class="pill warn">${i.days} 天後到期${auto}</span>`;
  return `<span class="pill mute">到 ${esc(i.latestEnd)}</span>`;
}
function statusPill(c){
  const s=c.status;
  return s?`<span class="pill ${STATUS_PILL[s]||'mute'}">${esc(s)}</span>`:`<span class="pill mute">待分類</span>`;
}
function rowActions(i){
  if(!canWrite||!isAdmin)return '';
  const c=i.c,k=esc(c.code),s=c.status;
  const dl=`<button class="btn sm bad" data-act="delClient" data-code="${k}">刪除</button>`;
  return rowActions0(i)+dl;
}
function rowActions0(i){
  const c=i.c,k=esc(c.code),s=c.status;
  if(s==='結案')return `<button class="btn sm" data-act="reopen" data-code="${k}">重新開啟</button>`;
  if(s==='進行中'||s==='暫停')return `<button class="btn sm primary" data-act="renew" data-code="${k}">續約</button><button class="btn sm" data-act="close" data-code="${k}">結案</button>`;
  return `<button class="btn sm" data-act="activate" data-code="${k}">設為進行中</button><button class="btn sm" data-act="close" data-code="${k}">結案</button>`;
}
function clientRow(i){

function renderClients(){
  const all=Object.keys(S.clients).sort().map(info);
  const counts={};TABS.forEach(([k])=>counts[k]=all.filter(i=>inTab(i,k)).length);
  if(tab==null&&loaded.clients&&loaded.contracts)tab=counts.action?'action':'active';
  const curTab=tab||'active';
  const q=query.trim().toLowerCase();
  let list=all.filter(i=>inTab(i,curTab));
  if(q)list=all.filter(i=>[i.c.code,i.c.brand,i.c.brands,i.c.fullName,i.c.taxId].join(' ').toLowerCase().includes(q));
  if(curTab==='action'&&!q)list.sort((a,b)=>a.days-b.days);
  else if(curTab==='closed'&&!q)list.sort((a,b)=>(b.c.closedAt||'').localeCompare(a.c.closedAt||'')||a.c.code.localeCompare(b.c.code));
  const sum=`<div class="sumline"><span><b>${counts.active}</b>進行中客戶</span><span><b>${counts.action}</b>需處理</span><span><b>${counts.pending}</b>待分類</span>${isAdmin?`<span><b class="num">${money(mrr())}</b>每月經常性收入（含稅）</span>`:''}</div>`;
  const banner=ls.get('pwBannerOff')?'':`<div class="note bad"><div><b>安全提醒：</b>總表「客戶合約款項紀錄」與「主機搬遷」頁有網站後台、網域與信箱的明文密碼，且同一組密碼重複使用。這個系統不存放任何密碼；建議改放密碼管理工具，並換掉重複使用的那組。</div><button class="btn sm" data-act="dismissPw">知道了</button></div>`;
  const newBtn=canWrite?`<button class="btn primary" data-act="newClient">＋ 新增客戶</button>`:'';
  const tabs=TABS.map(([k,t])=>`<button data-act="tab" data-v="${k}" aria-pressed="${curTab===k&&!q}">${t}<span class="n">${counts[k]}</span></button>`).join('');
  const body=!loaded.clients?'<div class="empty">載入中…</div>':list.length?list.map(clientRow).join(''):
    `<div class="empty">${q?'找不到符合的客戶。':all.length?'這個分類目前沒有客戶。':'還沒有客戶資料。按右上方「新增客戶」建立第一筆。'}</div>`;
  const focus=document.activeElement&&document.activeElement.id==='q';
  $('#main').innerHTML=`${banner}${sum}<div class="tools"><div class="tabs">${tabs}</div><span class="grow"></span><input type="search" id="q" placeholder="搜尋名稱、編號、統編" value="${esc(query)}" aria-label="搜尋客戶">${newBtn}</div><div class="list board">${body}</div>`;
  if(focus){const el=$('#q');el.focus();el.setSelectionRange(query.length,query.length)}
}

/* bills */
/* 所有金額一律含稅，不做稅額換算 */
function billCalc(b){const total=b.amount||0;return {total,bal:total-(b.received||0)}}
function needsInv(code){const c=S.clients[code];return !!(c&&c.needInvoice)}
function legacyMoney(){/* 尚未標記為「含稅」的舊資料（費用／帳單） */
  const f=Object.entries(S.fees).filter(([id,x])=>x&&x.amount!=null&&!x.incl).map(([id])=>id);
  const b=Object.entries(S.bills).filter(([id,x])=>x&&x.amount!=null&&!x.incl).map(([id])=>id);
  return {fees:f,bills:b,n:f.length+b.length}}
function legacyBanner(){
  if(!isAdmin)return '';const L=legacyMoney();if(!L.n)return '';
  return `<div class="infobox warn" style="margin:0 0 12px"><b>有 ${L.n} 筆舊資料的金額是「未稅」</b>（費用 ${L.fees.length}、帳單 ${L.bills.length}）。系統現在一律以含稅記錄，不會自動換算。確認後可一次轉成含稅（金額 × 1.05，四捨五入），已收金額不變；若你想逐筆自己改，也可以略過。<div style="margin-top:8px"><button class="btn sm primary" data-act="migrateIncl">一次轉為含稅</button> <button class="btn sm" data-act="markIncl">不轉換，直接視為已是含稅</button></div></div>`}
function renderBills(){
  const all=Object.entries(S.bills).map(([id,b])=>Object.assign({id},b,billCalc(b))).sort((a,b)=>(b.due||'').localeCompare(a.due||''));
  const open=all.filter(b=>b.bal>0);
  const pendInv=b=>b.bal<=0&&needsInv(b.clientCode)&&!b.invoiceNo;
  const list=billFilter==='open'?all.filter(b=>b.bal>0||pendInv(b)):all;
  const t=todayStr();
  const owing=open.reduce((s,b)=>s+b.bal,0);
  const trs=list.map(b=>{
    const cl=S.clients[b.clientCode];
    const st=b.bal<=0?'<span class="pill ok">已收</span>':(b.due&&b.due<t)?'<span class="pill bad">逾期</span>':'<span class="pill warn">未收</span>';
    return `<tr><td><span class="mono muted">${esc(b.clientCode)}</span> ${esc(cl?cl.brand||cl.fullName:'')}</td><td class="mono">${esc(b.period||'')}</td><td class="r num">${money(b.total)}</td><td class="mono">${esc(b.due||'—')}</td><td class="r num">${money(b.received||0)}</td><td class="r num"><b>${money(b.bal)}</b></td><td>${st}</td><td>${!needsInv(b.clientCode)?'<span class="muted">免開</span>':b.invoiceNo?`<span class="mono">${esc(b.invoiceNo)}</span>`:b.bal<=0?'<span class="pill warn">待開立</span>':'<span class="muted">收款後開</span>'}</td>
      <td><div class="acts">${canWrite?`${b.bal>0?`<button class="btn sm primary" data-act="payBill" data-id="${esc(b.id)}">收款</button>`:''}${needsInv(b.clientCode)&&b.bal<=0&&!b.invoiceNo?`<button class="btn sm primary" data-act="invBill" data-id="${esc(b.id)}">登記發票</button>`:''}<button class="btn sm" data-act="editBill" data-id="${esc(b.id)}">編輯</button>`:''}</div></td></tr>`}).join('');
  $('#main').innerHTML=`${legacyBanner()}<div class="sumline"><span><b class="num">${money(owing)}</b>未收餘額（含稅）</span><span><b>${open.length}</b>筆未結清</span></div>
  <div class="tools"><div class="tabs"><button data-act="billFilter" data-v="open" aria-pressed="${billFilter==='open'}">待處理</button><button data-act="billFilter" data-v="all" aria-pressed="${billFilter==='all'}">全部</button></div><span class="grow"></span>${canWrite?`<button class="btn" data-act="draftBills">產生月帳單草稿</button><button class="btn primary" data-act="newBill">＋ 新增帳單</button>`:''}</div>
  ${list.length?`<div class="tablewrap"><table><thead><tr><th>客戶</th><th>期別</th><th class="r">金額（含稅）</th><th>繳款日</th><th class="r">已收</th><th class="r">未收餘額</th><th>狀態</th><th>發票</th><th></th></tr></thead><tbody>${trs}</tbody></table></div>`:`<div class="list"><div class="empty">${all.length?'目前沒有待收款或待開發票的帳單。':'還沒有帳單。按「新增帳單」記錄一筆，或用「產生月帳單草稿」依進行中的月繳服務建立。'}</div></div>`}`;
}
/* todos */
function renderTodos(){
  const all=Object.entries(S.todos).map(([id,t])=>Object.assign({id},t)).sort((a,b)=>(a.done-b.done)||a.id.localeCompare(b.id));

function closeModal(){$('#modalroot').innerHTML=''}
function fieldHTML(f,v){
  const id='f_'+f.k,req=f.req?' req':'';
  if(f.type==='info')return `<div class="infobox ${f.warn?'warn':''}">${f.html}</div>`;
  let inp='';
  const val=v==null?'':v;
  if(f.type==='textarea')inp=`<textarea id="${id}" name="${f.k}">${esc(val)}</textarea>`;
  else if(f.type==='check'){return `<div class="fld"><label class="chk" style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="${id}" name="${f.k}" ${v?'checked':''}><span>${esc(f.label)}</span></label>${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`}
  else if(f.type==='checks'){const cur=Array.isArray(v)?v:[];inp=`<div class="chkrow">${(f.opts||[]).map(([a,b])=>`<label class="chk"><input type="checkbox" name="${f.k}" value="${esc(a)}" ${cur.includes(a)?'checked':''}><span>${esc(b)}</span></label>`).join('')}</div>`}
  else if(f.type==='select'||f.type==='bool'){
    const opts=f.type==='bool'?[['','未確認'],['true','是'],['false','否']]:(f.opts||[]).map(o=>Array.isArray(o)?o:[o,o]);
    const cur=f.type==='bool'?(v===true?'true':v===false?'false':''):String(val);
    inp=`<select id="${id}" name="${f.k}">${f.blank?'<option value="">（未設定）</option>':''}${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(a)===cur?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
  } else inp=`<input id="${id}" name="${f.k}" type="${f.type==='money'||f.type==='number'?'number':f.type||'text'}" ${f.type==='money'||f.type==='number'?'step="any" inputmode="decimal"':''} value="${esc(val)}" ${f.ph?`placeholder="${esc(f.ph)}"`:''}>`;
  return `<div class="fld${req}"><label for="${id}">${esc(f.label)}</label>${inp}${f.hint?`<div class="hint">${esc(f.hint)}</div>`:''}</div>`;
}
function openForm(o){
  const fs=o.fields.filter(Boolean);
  const html=[];let pair=[];
  const flush=()=>{if(pair.length){html.push(`<div class="two">${pair.join('')}</div>`);pair=[]}};
  fs.forEach(f=>{const h=fieldHTML(f,(o.values||{})[f.k]);if(f.half){pair.push(h);if(pair.length===2)flush()}else{flush();html.push(h)}});flush();
  $('#modalroot').innerHTML=`<div class="mwrap" id="mw"><div class="modal" role="dialog" aria-label="${esc(o.title)}"><h3>${esc(o.title)}</h3><form id="mf" novalidate>${html.join('')}</form><div class="err" id="merr"></div><div class="mfoot">${o.dangerLabel?`<button type="button" class="btn bad left" id="mdel">${esc(o.dangerLabel)}</button>`:''}<button type="button" class="btn" id="mcancel">取消</button><button type="button" class="btn primary" id="msave">${esc(o.submit||'儲存')}</button></div></div></div>`;
  const form=$('#mf'),err=$('#merr');
  const first=form.querySelector('input,select,textarea');if(first)first.focus();
  $('#mcancel').onclick=closeModal;
  $('#mw').addEventListener('mousedown',e=>{if(e.target.id==='mw')closeModal()});
  let delArmed=false;
  if(o.dangerLabel)$('#mdel').onclick=async()=>{
    if(!delArmed){delArmed=true;$('#mdel').textContent='再按一次確認刪除';return}
    $('#mdel').disabled=true;const ok=await run(o.onDanger,'已刪除');if(ok)closeModal();else $('#mdel').disabled=false;
  };
  $('#msave').onclick=async()=>{
    const v={};err.textContent='';
    for(const f of fs){
      if(f.type==='info')continue;
      if(f.type==='check'){v[f.k]=!!form.querySelector('input[name="'+f.k+'"]:checked');continue}
      if(f.type==='checks'){v[f.k]=[...form.querySelectorAll('input[name="'+f.k+'"]:checked')].map(x=>x.value);continue}
      const el=form.elements[f.k];if(!el)continue;
      let x=el.value.trim();
      if(f.req&&!x){err.textContent='請填「'+f.label+'」';el.focus();return}
      if(f.type==='bool')x=x==='true'?true:x==='false'?false:null;
      else if(f.type==='money'||f.type==='number')x=x===''?null:Number(x);
      else if(x==='')x=null;
      v[f.k]=x;
    }
    if(o.validate){const m=o.validate(v);if(m){err.textContent=m;return}}
    $('#msave').disabled=true;
    const ok=await run(()=>o.onSubmit(v),o.okMsg||'已儲存');
    if(ok)closeModal();else $('#msave').disabled=false;
  };
}

function openRenew(code,contractId){
  const i=info(code);
  const base=contractId?S.contracts[contractId]&&Object.assign({id:contractId},S.contracts[contractId]):(i.act.find(k=>k.end===i.latestEnd)||i.contracts[0]||null);
  const t=todayStr();
  const start=base&&base.end?addDays(base.end,1):t;
  const end=addYearMinusDay(start);
  const svcs=base?i.services.filter(s=>(s.contractNo===(base.no||base.id))&&s.status!=='結束'):i.services.filter(s=>s.status==='進行中');
  const carry=svcs.map(s=>{
    const f=S.fees[s.id];
    return `<label style="display:contents"><input type="checkbox" class="cs" data-sid="${esc(s.id)}" ${s.cycle==='一次性'||s.mode==='專案'?'':'checked'}><span class="lab">${esc(s.type)}　<span class="muted">${esc(s.cycle||'')}${s.desc?'・'+esc(s.desc.slice(0,28)):''}</span></span>${isAdmin?`<input type="number" step="any" class="cfee" data-sid="${esc(s.id)}" value="${f&&f.amount!=null?esc(f.amount):''}" placeholder="費用（未稅）" aria-label="新約費用">`:'<span></span>'}</label>`}).join('');
  $('#modalroot').innerHTML=`<div class="mwrap" id="mw"><div class="modal" role="dialog" aria-label="續約"><h3>續約　${esc(code)} ${esc(S.clients[code].brand||'')}</h3>
  <form id="mf" novalidate>
    <div class="infobox">${base?`續自合約 <b class="mono">${esc(base.no||base.id)}</b>（${esc(base.start||'—')} ～ ${esc(base.end||'—')}）。舊合約會標為「已續約」，並建立新合約。`:'這個客戶還沒有合約，將建立第一份合約。'}</div>
    <div class="two"><div class="fld req"><label for="r_start">新約起日</label><input id="r_start" type="date" value="${start}"></div><div class="fld req"><label for="r_end">新約迄日</label><input id="r_end" type="date" value="${end}"></div></div>
    <div class="two"><div class="fld"><label for="r_sign">簽約日</label><input id="r_sign" type="date" value="${t}"></div><div class="fld"><label for="r_auto">自動續約</label><select id="r_auto"><option value="true" ${base&&base.autoRenew===false?'':'selected'}>是</option><option value="false" ${base&&base.autoRenew===false?'selected':''}>否</option><option value="">未確認</option></select></div></div>
    <div class="fld"><label for="r_file">新合約檔連結</label><input id="r_file" type="text" placeholder="https://drive.google.com/file/d/…"></div>
    ${svcs.length?`<div><div class="muted" style="font-size:12.5px;margin-bottom:6px">帶入新約的服務項目${isAdmin?'與費用（含稅）':''}；舊服務會標為「結束」。</div><div class="carry">${carry}</div></div>`:'<div class="muted">沒有可帶入的服務項目，續約後可在客戶頁新增。</div>'}
    <div class="fld"><label for="r_note">備註</label><textarea id="r_note" placeholder="例如：調漲、改月繳、新增 GEO"></textarea></div>
  </form><div class="err" id="merr"></div>
  <div class="mfoot"><button type="button" class="btn" id="mcancel">取消</button><button type="button" class="btn primary" id="msave">確認續約</button></div></div></div>`;
  $('#mcancel').onclick=closeModal;
  $('#mw').addEventListener('mousedown',e=>{if(e.target.id==='mw')closeModal()});
  $('#msave').onclick=async()=>{
    const ns=$('#r_start').value,ne=$('#r_end').value,err=$('#merr');
    if(!ns||!ne){err.textContent='請填新約起訖日';return}
    if(ne<ns){err.textContent='迄日不能早於起日';return}
    $('#msave').disabled=true;
    const ok=await run(async()=>{
      const no=nextContractNo(code);
      const auto=$('#r_auto').value;
      await setDoc('contracts',no,{clientCode:code,no,signDate:$('#r_sign').value||null,start:ns,end:ne,autoRenew:auto===''?null:auto==='true',fileUrl:$('#r_file').value.trim()||null,status:'有效',renewedFrom:base?(base.no||base.id):null,note:$('#r_note').value.trim()||null});
      if(base)await upd('contracts',base.id,{status:'已續約',renewedTo:no});
      const picked=[...document.querySelectorAll('.cs')];
      for(const cb of picked){
        const sid=cb.dataset.sid,old=S.services[sid];if(!old)continue;
        if(cb.checked){
          const nid=newId('services');

          if(isAdmin){const fe=document.querySelector(`.cfee[data-sid="${sid}"]`);const amt=fe&&fe.value!==''?Number(fe.value):null;if(amt!=null)await setDoc('fees',nid,{amount:amt,incl:true})}
        }

      for(const s of svcs){if(s.status!=='結束')await upd('services',s.id,{status:'結束'})}

      await addLog(code,'續約',`${no}　${ns} ～ ${ne}${$('#r_note').value.trim()?'　'+$('#r_note').value.trim():''}`);
    },'已續約');
    if(ok){closeModal();tab='active';queue()}else $('#msave').disabled=false;
  };
}

function draftBills(){
  const d=new Date();d.setMonth(d.getMonth()+1,1);
  const period=d.getFullYear()+'-'+p2(d.getMonth()+1);
  const drafts=[];
  Object.keys(S.clients).sort().forEach(code=>{
    if(S.clients[code].status!=='進行中')return;
    const sum=rows('services',code).filter(s=>s.status==='進行中'&&s.cycle==='月繳').reduce((t,s)=>t+((S.fees[s.id]||{}).amount||0),0);
    if(sum>0&&!Object.values(S.bills).some(b=>b.clientCode===code&&b.period===period))drafts.push({code,amount:sum});
  });
  openForm({title:'產生月帳單草稿',submit:drafts.length?`建立 ${drafts.length} 筆`:'關閉',fields:[
    {k:'period',label:'帳單期別 (YYYY-MM)',req:true,hint:'預設下個月；繳款日為當月 1 日。同客戶同期別已有帳單的不重複建立。'},
    {k:'i',type:'info',html:drafts.length?drafts.map(x=>`${esc(x.code)} ${esc(S.clients[x.code].brand||'')}　${money(x.amount)}`).join('<br>'):'沒有可建立的草稿（只計算進行中客戶的月繳服務）。'}],
    values:{period},okMsg:'已建立草稿',
    onSubmit:async v=>{
      if(!drafts.length)return;
      for(const x of drafts){
        if(Object.values(S.bills).some(b=>b.clientCode===x.code&&b.period===v.period))continue;
        await setDoc('bills',newId('bills'),{clientCode:x.code,period:v.period,amount:x.amount,received:0,due:v.period+'-01',note:'草稿',invoiceNo:null,incl:true});
      }}});
}

/* 週期任務：五種預設 + 自訂（自己命名、選頻率、選週幾／幾號截止）。plan.preset==='custom' 的用 plan 自己的 label/kind/freq。 */
const FREQS=[['週','每週'],['雙週','每兩週'],['月','每月'],['2月','每兩個月'],['季','每季（3 個月）'],['半年','每半年'],['年','每年']];
const FREQ_NAME=Object.fromEntries(FREQS);
const MSTEP={'月':1,'2月':2,'季':3,'半年':6,'年':12};
const WDAYS=[['1','週一'],['2','週二'],['3','週三'],['4','週四'],['5','週五'],['6','週六'],['7','週日']];
const WD_NAME=Object.fromEntries(WDAYS);
const CUSTOM_KINDS=['週文章','月報告','月部落文','其他'];
const planSpec=pl=>{const pr=PRESET[pl.preset];return pr?{id:pr.id,label:pr.label,kind:pr.kind,svc:pr.svc,freq:pr.freq,custom:false}:{id:'custom',label:pl.label||'（未命名）',kind:pl.kind||'其他',svc:pl.svc||'',freq:FREQ_NAME[pl.freq]?pl.freq:'月',custom:true}};
const isWeekly=f=>f==='週'||f==='雙週';
const weekdayDates=(p,wd)=>{const [y,m]=p.split('-').map(Number);const o=[];for(let d=1;d<=lastDayOf(p);d++){if((new Date(Date.UTC(y,m-1,d)).getUTCDay()||7)===wd)o.push(p+'-'+p2(d))}return o};
const weekIdx=s=>Math.floor((toUTC(s)/864e5+3)/7);   // 以週一為起點的週序號
const biweekOK=(dt,start)=>(((weekIdx(dt)-weekIdx(start||'1970-01-05'))%2)+2)%2===0;
const monthIdx=s=>{const [y,m]=s.split('-').map(Number);return y*12+m-1};
const coverOK=(code,ps,pe)=>{const cs=rows('contracts',code);return !cs.length||cs.some(k=>k.status==='有效'&&(!k.start||k.start<=pe)&&(!k.end||k.end>=ps))};
function genPlan(p){
  const ps=p+'-01',pe=p+'-'+p2(lastDayOf(p));
  const create=[],skipped=new Set();
  const mk=(id,data)=>{if(!S.tasks[id])create.push({id,data})};
  Object.keys(S.clients).sort().forEach(code=>{
    if(S.clients[code].status!=='進行中')return;
    const cov=coverOK(code,ps,pe);
    rows('plans',code).filter(x=>x.active!==false).forEach(pl=>{
      if(!PRESET[pl.preset]&&pl.preset!=='custom')return;
      const sp=planSpec(pl);if(!(pl.count>0))return;
      if((pl.start&&pl.start>pe)||(pl.end&&pl.end<ps))return;
      const sop=sopFor(sp.svc,sp.kind);
      const rate=(pl.rate!=null&&pl.rate!=='')?Number(pl.rate):rateFor(sp.kind);
      const due=pl.dueDay?p+'-'+p2(Math.min(pl.dueDay,lastDayOf(p))):dueFor(code,p);
      const fin=o=>Object.assign({assignee:lc(pl.assignee)||defaultAssignee(),clientCode:code,planId:pl.id,serviceId:null,period:p,kind:sp.kind,done:0,rate,links:[],note:null,submitted:false,subN:0,history:[],sop:sop.slice(),checked:sop.map(()=>false)},o);
      const cand=[];   // 這個設定這個月該建的任務；有才檢查合約是否涵蓋
      if(isWeekly(sp.freq)){
        const wd=Number(pl.weekday)||5,f5=s=>s.slice(5).replace('-','/');
        weekdayDates(p,wd).forEach(dt=>{
          if(sp.freq==='雙週'&&!biweekOK(dt,pl.start))return;
          const mon=addDays(dt,-(wd-1));
          if((pl.start&&pl.start>dt)||(pl.end&&pl.end<mon))return;
          cand.push([`${pl.id}_w${dt}`,fin({title:sp.custom?`${sp.label} ${f5(mon)}～${f5(dt)}`:`${sp.svc}・週文章 ${f5(mon)}～${f5(dt)}`,target:pl.count,due:dt,weekStart:mon})]);
        });
      }else{
        const step=MSTEP[sp.freq]||1;
        if(step>1){const anchor=pl.start?monthIdx(pl.start):0;if((((monthIdx(p)-anchor)%step)+step)%step!==0)return}
        cand.push([`${pl.id}_${p}`,fin({title:sp.custom?`${sp.label} ${p}`:`${sp.svc}・${sp.kind}`,target:pl.count,due})]);
        if(sp.id==='blog'&&pl.rewrite>0){
          const rs=sopFor(sp.svc,'批量改寫');
          cand.push([`${pl.id}_${p}_rewrite`,{clientCode:code,planId:pl.id,serviceId:null,period:p,kind:'批量改寫',title:`${sp.svc}・批量改寫`,target:pl.rewrite,due,assignee:rewriteAssignee(),done:0,rate:null,links:[],note:null,submitted:false,subN:0,history:[],sop:rs.slice(),checked:rs.map(()=>false)}]);
        }
      }
      if(!cand.length)return;
      if(!pl.start&&!pl.end&&!cov){skipped.add(code);return}
      cand.forEach(([id,d])=>mk(id,d));
    });
  });
  return {create,skipped:[...skipped]};
}

async function tUpd(id,patch,histText){
  const t=Object.assign({id},S.tasks[id]);
  const d=Object.assign({},patch);if(histText)d.history=histAdd(t,histText);
  await upd('tasks',id,d);
}
function trySubmit(id){
  const t=Object.assign({id},S.tasks[id]);
  const miss=[];
  const unchecked=(t.sop||[]).filter((_,i)=>!(t.checked||[])[i]).length;
  if(unchecked)miss.push(`還有 ${unchecked} 項 SOP 沒勾`);
  if((t.done||0)<(t.target||0))miss.push(`完成數量 ${t.done||0}／${t.target}，還沒達到目標`);
  if(!(t.links||[]).length)miss.push('還沒貼任何交付內容連結');
  if(miss.length){toast('不能送交驗收：'+miss.join('；'));return}
  run(()=>tUpd(id,{submitted:true,subN:(t.subN||0)+1,revise:false,sentAt:null,confirmedAt:null,publishedAt:null,deliveredAt:null},'送交驗收'),'已送交驗收，等待管理者確認');
}

/* ---------- views ---------- */
const STK={'待處理':'todo','進行中':'doing','待驗收':'wait','退回':'back','已驗收':'acc','已交付':'done'};
function pillState(st){return `<span class="pill ${STATE_PILL[st]}">${st}</span>`}
function periodBar(){
  return `<div class="pbar"><button class="btn sm" data-act="pshift" data-d="-1" aria-label="上個月">‹</button><b class="mono">${esc(period)}</b><button class="btn sm" data-act="pshift" data-d="1" aria-label="下個月">›</button>${period!==curPeriod()?'<button class="btn sm ghost" data-act="pnow">回到本月</button>':''}</div>`;
}
function segBar(counts,total){
  if(!total)return '<div class="seg"></div>';
  return `<div class="seg" role="img" aria-label="進度分佈">${STATES.map(s=>counts[s]?`<i style="flex:${counts[s]};background:${STATE_COLOR[s]}" title="${s} ${counts[s]}"></i>`:'').join('')}</div>`;
}
let ovMode='week',ovWeek=null,ovMonth=null;
const mondayOf=d=>addDays(d,-((new Date(toUTC(d)).getUTCDay()||7)-1));
const WKN=['日','一','二','三','四','五','六'];
const md=d=>d.slice(5).replace('-','/');
const wdName=d=>'週'+WKN[new Date(toUTC(d)).getUTCDay()];
function renderMyDash(){
  const today=todayStr();
  if(!ovWeek)ovWeek=mondayOf(today);
  if(!ovMonth)ovMonth=today.slice(0,7);
  const all=taskList().filter(isMine);
  const sent=t=>!['待處理','進行中','退回'].includes(t.state);   // 已送交驗收就算我這端完成
  const wk=ovMode==='week';
  const from=wk?ovWeek:ovMonth+'-01',to=wk?addDays(ovWeek,6):ovMonth+'-'+p2(lastDayOf(ovMonth));
  const label=wk?md(from)+' – '+md(to):ovMonth.replace('-','／');
  const isNow=wk?ovWeek===mondayOf(today):ovMonth===today.slice(0,7);
  const inR=all.filter(t=>t.due&&t.due>=from&&t.due<=to).sort((a,b)=>(a.due||'').localeCompare(b.due||'')||a.clientCode.localeCompare(b.clientCode));
  const old=all.filter(t=>t.due&&t.due<from&&!sent(t)).sort((a,b)=>a.due.localeCompare(b.due));
  const cnt=f=>inR.filter(f).length;
  const todo=cnt(t=>['待處理','進行中'].includes(t.state)),back=cnt(t=>t.state==='退回'),done=cnt(sent);
  const row=t=>`<div class="lrow" data-act="openTask" data-id="${esc(t.id)}" role="button" tabindex="0"><div class="lmain"><b>${esc(clientName(t.clientCode))}</b><span>${esc(t.title)}${t.due&&t.due<today&&!sent(t)?'　截止 '+md(t.due):''}</span></div><div class="lside"><span class="st s-${STK[t.state]}">${t.state}</span><span class="qty">${t.done||0} / ${t.target||0} ${unit(t.kind)}</span></div></div>`;
  const groups=new Map();
  inR.forEach(t=>{const k=wk?t.due:mondayOf(t.due);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(t)});
  let keys=[];
  if(wk){for(let i=0;i<7;i++)keys.push(addDays(ovWeek,i))}
  else{for(let k=mondayOf(from);k<=to;k=addDays(k,7))keys.push(k)}
  const strip=keys.map(k=>{
    const ts=groups.get(k)||[],n=ts.length,ok=n&&ts.every(sent);
    const now=wk?k===today:(today>=k&&today<=addDays(k,6));
    const top=wk?'週'+WKN[new Date(toUTC(k)).getUTCDay()]:md(k)+' 起';
    const sub=wk?md(k):'';
    return `<button class="cd${now?' now':''}" ${n?'':'disabled'} data-act="ovday" data-k="${k}" aria-label="${top} ${n} 項"><span class="cd-w">${top}</span>${sub?`<span class="cd-d">${sub}</span>`:''}<span class="cd-n${n?'':' z'}${ok?' ok':''}">${ok?'完成':(n?n+' 項':'—')}</span></button>`}).join('');
  const body=[...groups.entries()].map(([k,ts])=>{
    const head=wk?`${wdName(k)}　${md(k)}${k===today?'<em class="tg">今天</em>':''}`:`${md(k)} – ${md(addDays(k,6))}${(today>=k&&today<=addDays(k,6))?'<em class="tg">本週</em>':''}`;
    return `<div class="lhead" id="g-${k}"><span>${head}</span><span class="muted">${ts.length} 項</span></div>${ts.map(row).join('')}`}).join('');
  const total=all.length,openN=all.filter(t=>!sent(t)).length;
  $('#main').innerHTML=`
  <div class="ovhead">
    <div><h1>${wk?'本週':'本月'}</h1><div class="range">${label}${isNow?'':`<button class="linkbtn" data-act="ovnow">${wk?'回本週':'回本月'}</button>`}</div></div>
    <div class="ovctl"><div class="utabs"><button data-act="ovmode" data-v="week" aria-pressed="${wk}">每週</button><button data-act="ovmode" data-v="month" aria-pressed="${!wk}">每月</button></div>
      <div class="stepper"><button class="btn sm" data-act="ovshift" data-d="-1" aria-label="上一個">‹</button><button class="btn sm" data-act="ovshift" data-d="1" aria-label="下一個">›</button></div></div>
  </div>
  <div class="calstrip" style="--n:${keys.length}">${strip}</div>
  <p class="ovsum">${wk?'這週':'這個月'}共 <b>${inR.length}</b> 項：待完成 <b>${todo}</b>，被退回 <b${back?' class="bad"':''}>${back}</b>，已送交 <b>${done}</b>。　我的全部任務 <b>${total}</b> 項，尚未完成 <b>${openN}</b> 項。</p>
  ${old.length?`<details class="late" ${old.length<=3?'open':''}><summary>往期尚未完成<span>${old.length} 項</span></summary><div class="ledger">${old.map(row).join('')}</div></details>`:''}
  ${body?`<div class="ledger">${body}</div>`:`<div class="emptyday">${wk?'這週':'這個月'}沒有要交的任務。</div>`}`;
}
function renderDash(){
  const all=taskList();
  const ts=all.filter(t=>t.period===period);
  const counts={};STATES.forEach(s=>counts[s]=ts.filter(t=>t.state===s).length);
  const total=ts.length,delivered=counts['已交付'];
  const accepted=t=>t.state==='已驗收'||t.state==='已交付';
  const grp=kind=>({t:ts.filter(t=>t.kind===kind).reduce((n,t)=>n+(t.target||0),0),d:ts.filter(t=>t.kind===kind&&accepted(t)).reduce((n,t)=>n+(t.done||0),0)});
  const gW=grp('週文章'),gR=grp('月報告'),gB=grp('月部落文');
  const late=ts.filter(t=>t.late).length;
  const carry=all.filter(t=>t.period<period&&t.state!=='已交付').length;
  let cost=0,costAll=0,noRate=0;
  ts.forEach(t=>{if(isAdminUser(ownerOf(t)))return;if(t.rate==null){noRate++;return}costAll+=(t.target||0)*t.rate;if(accepted(t))cost+=(t.done||0)*t.rate});
  const waiting=ts.filter(t=>t.state==='待驗收'),todo=ts.filter(t=>t.state==='退回'||(t.late&&t.state!=='待驗收'));
  const clients=[...new Set(ts.map(t=>t.clientCode))].sort();
  const crow=code=>{
    const cts=ts.filter(t=>t.clientCode===code);
    const cc={};STATES.forEach(s=>cc[s]=cts.filter(t=>t.state===s).length);
    const sm=kind=>{const x=cts.filter(t=>t.kind===kind);return {d:x.filter(accepted).reduce((n,t)=>n+(t.done||0),0),t:x.reduce((n,t)=>n+(t.target||0),0)}};
    const w=sm('週文章'),rp=sm('月報告'),bl=sm('月部落文');
    const due=cts.reduce((m,t)=>(!m||t.due<m)?t.due:m,'');
    const lt=cts.some(t=>t.late);
    const done=cc['已交付']===cts.length;
    return `<tr class="click" data-act="openBoardClient" data-code="${esc(code)}"><td><span class="mono muted">${esc(code)}</span> <b>${esc(clientName(code))}</b></td><td class="num">${w.t?`${w.d}／${w.t} 篇`:'—'}</td><td class="num">${rp.t?`${rp.d}／${rp.t} 份`:'—'}</td><td class="num">${bl.t?`${bl.d}／${bl.t} 篇`:'—'}</td><td style="min-width:150px">${segBar(cc,cts.length)}</td><td class="mono">${esc(due)}</td><td>${done?'<span class="pill done">全部已交付</span>':lt?'<span class="pill bad">有逾期</span>':cc['待驗收']?'<span class="pill warn">待驗收</span>':cc['退回']?'<span class="pill bad">被退回</span>':'<span class="pill info">進行中</span>'}</td></tr>`;
  };
  const chips=STATES.map(s=>`<button class="legend" data-act="jumpBoard" data-v="${s}"><i style="background:${STATE_COLOR[s]}"></i>${s}<b class="mono">${counts[s]}</b></button>`).join('');
  const listRows=(arr,btnText)=>arr.length?arr.map(t=>`<div class="qrow" data-act="openTask" data-id="${esc(t.id)}" role="button" tabindex="0"><div style="min-width:0"><b>${esc(clientName(t.clientCode))}</b>・${esc(t.title)}<div class="sub muted">${(t.done||0)+'／'+t.target+' '+unit(t.kind)+'・'}截止 ${esc(t.due||'—')}${t.late?'・<span style="color:var(--bad)">已逾期</span>':''}</div></div><span class="btn sm">${btnText}</span></div>`).join(''):'<div class="in muted">目前沒有。</div>';
  const empty=!total?`<div class="list"><div class="empty">${esc(period)} 還沒有任務。<br>${canWrite?'按「產生月任務」，系統會依各客戶詳情裡的「週期任務設定」建立，並自動設定截止日。要先在客戶詳情設定每個客戶要做哪些任務。':''}</div></div>`:'';
  $('#main').innerHTML=`<div class="tools">${periodBar()}<span class="grow"></span>${canWrite&&isAdmin?`<button class="btn" data-act="newTask">＋ 新增任務</button><button class="btn primary" data-act="genTasks">產生月任務</button>`:''}</div>
  ${carry?`<div class="note warn"><div><b>往期還有 ${carry} 項沒完成交付。</b></div><button class="btn sm" data-act="jumpOld">查看</button></div>`:''}
  ${total?`<section class="sec"><div class="in">
    <div class="bighead"><span><b class="big num">${delivered}</b><span class="muted">／${total} 項已交付客戶</span></span><span class="muted">${total?Math.round(delivered/total*100):0}%</span></div>
    ${segBar(counts,total)}<div class="legends">${chips}</div>
    <div class="kpis"><div><b class="num">${gW.d}／${gW.t}</b><span>週文章（已驗收）</span></div><div><b class="num">${gR.d}／${gR.t}</b><span>月報告（已驗收）</span></div><div><b class="num">${gB.d}／${gB.t}</b><span>月部落文（已驗收）</span></div><div><b class="num" style="color:${late?'var(--bad)':'inherit'}">${late}</b><span>逾期未交付</span></div>${isAdmin?`<div><b class="num">${money(cost)}</b><span>員工成本（已驗收）／預估 ${money(costAll)}${noRate?`，${noRate} 項未設單價`:''}</span></div>`:''}</div></div></section>
  <div class="two-col"><section class="sec"><header><h3>${isAdmin?'等你驗收':'已送交，等管理者驗收'}</h3><span class="pill warn">${waiting.length}</span></header>${listRows(waiting,isAdmin?'驗收':'查看')}</section>

const CH_TYPES=[['push','手機推播（Claude App）'],['line','LINE 官方帳號'],['email','Email'],['webhook','Slack／Discord／Webhook'],['other','其他']];
function ruleCfg(def){const saved=(S.notify.rules||{})[def.id]||{};return {on:saved.on!==false,days:saved.days!=null?saved.days:def.days,ch:Array.isArray(saved.ch)?saved.ch:def.ch.slice()}}
function computeAlerts(){
  const out=[],today=todayStr(),tl=taskList();
  const R={};NOTIFY_RULES.forEach(d=>{R[d.id]=ruleCfg(d)});
  const on=id=>R[id].on&&R[id].ch.includes('app')&&(isAdmin||!NOTIFY_RULES.find(d=>d.id===id).admin);
  if(on('contract'))Object.keys(S.clients).sort().forEach(code=>{
    const i=info(code);
    if(!(i.c.status==='進行中'||i.c.status==='暫停')||i.days==null||i.days>R.contract.days)return;
    out.push({sev:i.days<0?'bad':'warn',title:clientName(code)+'・合約 '+(i.days<0?'已過期 '+(-i.days)+' 天':i.days+' 天後到期'),detail:(i.auto?'約定自動續約，請確認後按「續約」登記':'不自動續約，請決定續約或結案')+'（到期日 '+i.latestEnd+'）',act:{a:'open',code}});
  });
  tl.forEach(t=>{
    const nm=clientName(t.clientCode)+'・'+t.title;
    const base={a:'openTask',id:t.id};
    if(t.late&&on('taskLate')&&t.state!=='待驗收'){out.push({sev:'bad',title:nm+'・逾期 '+diffDays(today,t.due)+' 天',detail:'狀態：'+t.state+'（截止 '+t.due+'）',act:base});return}
    if(t.late&&on('taskLate')&&t.state==='待驗收'&&isAdmin){out.push({sev:'bad',title:nm+'・逾期未驗收',detail:'已送交但超過截止日 '+diffDays(today,t.due)+' 天',act:base});return}
    if(!t.late&&['待處理','進行中','退回'].includes(t.state)&&on('taskDue')){const d=t.due?diffDays(t.due,today):-1;if(d>=0&&d<=R.taskDue.days)out.push({sev:'warn',title:nm+'・'+(d===0?'今天截止':d+' 天後截止'),detail:'目前 '+(t.done||0)+'／'+t.target+' '+unit(t.kind)+'，SOP '+(t.checked||[]).filter(Boolean).length+'／'+(t.sop||[]).length,act:base})}
    if(t.state==='待驗收'&&on('wait')){
      const h=(t.history||[]).filter(x=>x.text==='送交驗收').pop();
      if(h&&(Date.now()-new Date(h.at).getTime())>=R.wait.days*864e5)out.push({sev:'warn',title:nm+'・等你驗收',detail:'送交於 '+h.at.slice(0,10),act:base});
    }
    if(t.kind==='月部落文'&&t.state==='已驗收'&&on('blog')){
      const a=S.accept[t.id],N=R.blog.days*864e5,since=x=>Date.now()-new Date(x).getTime();
      let msg=null;
      if(!t.sentAt&&a&&since(a.at)>=N)msg='驗收後還沒送客戶確認（驗收於 '+a.at.slice(0,10)+'）';
      else if(t.sentAt&&!t.confirmedAt&&since(t.sentAt)>=N)msg='送客戶確認後客戶還沒回覆（送出 '+t.sentAt+'）';
      else if(t.confirmedAt&&!t.publishedAt&&since(t.confirmedAt)>=N)msg='客戶已確認但還沒發佈（確認 '+t.confirmedAt+'）';
      if(msg)out.push({sev:'warn',title:nm+'・流程卡關',detail:msg,act:base});
    }
    if(t.state==='已交付'&&t.kind!=='月部落文'&&!t.confirmedAt&&t.deliveredAt&&on('confirm')&&(Date.now()-new Date(t.deliveredAt).getTime())>=R.confirm.days*864e5)out.push({sev:'warn',title:nm+'・客戶還沒確認',detail:'已於 '+t.deliveredAt+' 交付，等客戶確認',act:base});
    if(t.state==='退回'&&on('rejected')){
      const a=S.accept[t.id];const at=t.revise?t.reviseAt:(a&&a.at);
      if(at&&(Date.now()-new Date(at).getTime())>=R.rejected.days*864e5)out.push({sev:'warn',title:nm+(t.revise?'・客戶要求修改後沒重送':'・退回後沒重送'),detail:(t.revise?'客戶要求：'+(t.reviseNote||''):'退回：'+((a&&a.reason)||''))+'（'+at.slice(0,10)+'）',act:base});
    }
  });
  if(on('bill'))Object.entries(S.bills).forEach(([id,b])=>{const c=billCalc(b);if(c.bal>0&&b.due&&b.due<today)out.push({sev:'bad',title:clientName(b.clientCode)+'・帳款逾期 '+diffDays(today,b.due)+' 天',detail:b.period+' 未收 '+money(c.bal),act:{a:'goto',v:'bills'}})});
  const dom=Number(today.slice(8,10)),next=shiftPeriod(curPeriod(),1);
  if(on('gen')&&dom>=R.gen.days&&!Object.values(S.tasks).some(t=>t.period===next))out.push({sev:'warn',title:'該產生 '+next+' 月任務了',detail:'按「產生月任務」；合約已過期的客戶要先續約',act:{a:'goGen',p:next}});
  if(on('draft')&&isAdmin&&dom>=R.draft.days&&!Object.values(S.bills).some(b=>b.period===next))out.push({sev:'warn',title:'該產生 '+next+' 月帳單草稿了',detail:'繳款日 '+next+'-01；到「帳款」按「產生月帳單草稿」',act:{a:'goto',v:'bills'}});
  out.sort((x,y)=>(x.sev==='bad'?0:1)-(y.sev==='bad'?0:1));
  return out;
}
function alertBtn(al){
  const a=al.act;
  if(a.a==='open')return `<button class="btn sm" data-act="open" data-code="${esc(a.code)}">查看</button>`;
  if(a.a==='openTask')return `<button class="btn sm" data-act="openTask" data-id="${esc(a.id)}">查看</button>`;
  if(a.a==='goGen')return `<button class="btn sm" data-act="goGen" data-p="${esc(a.p)}">前往</button>`;
  return `<button class="btn sm" data-act="goto" data-v="${esc(a.v)}">前往</button>`;
}

  const al=computeAlerts();

  const chs=Object.entries(S.channels).map(([id,c])=>Object.assign({id},c));
  const chName=id=>id==='app'?'應用內':((chs.find(c=>c.id===id)||{}).name||id);
  const rulesHTML=NOTIFY_RULES.map(d=>{
    const c=ruleCfg(d);
    return `<div class="item"><div class="main"><div class="title">${esc(d.label)}<span class="pill ${c.on?'ok':'mute'}">${c.on?'啟用':'停用'}</span>${d.days!=null?`<span class="muted">${d.id==='gen'||d.id==='draft'?'每月 '+c.days+' 日起':c.days+' '+d.unit}</span>`:''}${d.admin?'':'<span class="pill info">員工也會看到</span>'}</div><div class="sub">${esc(d.desc.replace('N',d.days!=null?c.days:'N'))}</div><div class="chips" style="margin-top:4px">${c.ch.map(x=>`<span class="chip">${esc(chName(x))}</span>`).join('')||'<span class="muted">未選任何通知方式</span>'}</div></div>${canWrite&&isAdmin?`<button class="btn sm" data-act="editRule" data-id="${d.id}">設定</button>`:''}</div>`}).join('');
  const chHTML=chs.length?chs.map(c=>{
    const t=(CH_TYPES.find(x=>x[0]===c.type)||[0,'其他'])[1];
    const live=false;
    return `<div class="item"><div class="main"><div class="title">${esc(c.name||t)}<span class="pill ${c.enabled===false?'mute':'info'}">${esc(t)}</span><span class="pill warn">${c.type==='push'?'尚未啟用每日檢查':'待串接'}</span></div><div class="sub">${c.target?'收件：'+esc(c.target):'未填收件對象'}${c.note?'・'+esc(c.note):''}</div></div>${canWrite?`<button class="btn sm" data-act="editChannel" data-id="${esc(c.id)}">編輯</button>`:''}</div>`}).join(''):'<div class="in muted">還沒有通知方式。按右上「新增通知方式」。</div>';
  $('#main').innerHTML=`<section class="sec"><header><h3>現在需要處理的通知</h3><span class="pill ${al.length?'warn':'mute'}">${al.length}</span></header>${alHTML}</section>
  ${isAdmin?`<div class="note warn"><div><b>目前只有「應用內」會即時通知。</b>你打開這個頁面時，上面的清單就是依下方規則算出來的。<br>要在你沒開頁面時也收到推播、LINE 或 Email，需要一個定時執行的程式去檢查並發送，這部分還沒啟用：手機推播要建立「每日檢查」排程，LINE 與 Email 要在階段一的後端接上發送。下方的設定會先存起來，之後直接沿用。</div></div>
  <section class="sec"><header><h3>通知規則</h3></header>${rulesHTML}</section>
  <section class="sec"><header><h3>通知方式</h3>${canWrite?'<button class="btn sm" data-act="newChannel">＋ 新增通知方式</button>':''}</header>${chHTML}<div class="in muted" style="border-top:1px solid var(--line);font-size:12.5px">收件欄只填對象（例如 LINE 群組名稱、Email 地址）。請不要貼 token、密碼或含金鑰的網址；發送用的金鑰要放在後端環境設定，不放在這個頁面。</div></section>`:`<div class="note"><div>這裡只顯示和你工作有關的提醒（任務截止、逾期、被退回）。</div></div>`}`;
}

        for(const id of L.bills)await setDoc('bills',id,Object.assign({},S.bills[id],{incl:true}))}})}
  else if(a==='invBill'){const b=S.bills[id];if(!b)return;
    openForm({title:'登記發票',submit:'儲存',fields:[{k:'i',type:'info',html:`${esc(b.clientCode)} ${esc(b.period)}　含稅 ${money(b.amount)}。請先到易發票人工開立，再填入號碼。`},{k:'invoiceNo',label:'發票號碼',req:true},{k:'invoiceAt',label:'開立日',type:'date'}],values:{invoiceAt:todayStr()},okMsg:'已登記發票',onSubmit:v=>upd('bills',id,{invoiceNo:v.invoiceNo,invoiceAt:v.invoiceAt})})}
  else if(a==='payBill'){const b=S.bills[id];if(!b)return;const bc=billCalc(b);
    openForm({title:'收款',submit:'登記收款',fields:[{k:'i',type:'info',html:`${esc(b.clientCode)} ${esc(b.period)}　應收（含稅）${money(bc.total)}，已收 ${money(b.received||0)}`},{k:'received',label:'累計已收金額（含稅）',type:'money',req:true},{k:'receivedAt',label:'收款日',type:'date'}],values:{received:bc.total,receivedAt:todayStr()},okMsg:'已登記收款',onSubmit:v=>upd('bills',id,{received:v.received,receivedAt:v.receivedAt})})}
});
document.addEventListener('change',async e=>{
  const el=e.target.closest('[data-act="toggleTodo"]');
  if(el&&canWrite){await run(()=>upd('todos',el.dataset.id,{done:el.checked}))}
  const ck=e.target.closest('[data-act="tcheck"]');
  if(ck&&canWrite&&openTask){const t=S.tasks[openTask];const arr=(t.checked||(t.sop||[]).map(()=>false)).slice();arr[Number(ck.dataset.i)]=ck.checked;await run(()=>tUpd(openTask,{checked:arr}))}
  if(e.target.id==='t_done'&&canWrite&&openTask){await run(()=>tUpd(openTask,{done:Math.max(0,Number(e.target.value)||0)}))}
  if(e.target.id==='t_note'&&canWrite&&openTask){await run(()=>tUpd(openTask,{note:e.target.value.trim()||null}))}
});
document.addEventListener('focusout',e=>{if(e.target.closest&&e.target.closest('#layer .panel'))setTimeout(queue,300)});
document.addEventListener('input',e=>{if(e.target.id==='q'){query=e.target.value;renderClients()}
  if(e.target.id==='bq'){boardQuery=e.target.value;renderBoard(view==='mine');const el=$('#bq');if(el){el.focus();el.setSelectionRange(boardQuery.length,boardQuery.length)}}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if($('#modalroot').firstChild)closeModal();else if(openCode||openTask){openCode=null;openTask=null;queue()}}
  if((e.key==='Enter'||e.key===' ')&&e.target.classList&&e.target.classList.contains('crow')){e.preventDefault();openCode=e.target.dataset.code;queue()}
  if((e.key==='Enter'||e.key===' ')&&e.target.dataset&&e.target.dataset.act==='openTask'&&e.target.getAttribute('role')==='button'){e.preventDefault();openTask=e.target.dataset.id;openCode=null;queue()}
});

/* ---------- boot ---------- */
async function boot(){
  const cl=window.claude;
  if(!cl||!cl.use){$('#main').innerHTML='<div class="empty">請在 claude.ai 裡開啟這個頁面。</div>';return}
  db=await cl.use('db');
  const user=await cl.use('user');
  if(!db){$('#main').innerHTML='<div class="empty">需要登入才能讀取客戶資料。</div>';return}
  try{isAdmin=user?await user.canEdit():false}catch(e){isAdmin=false}
  if(!isAdmin)view='dash';
  try{const w=user?await user.can('data.write'):null;canWrite=w!==false}catch(e){}
  const timer=setTimeout(()=>{if(!loaded.clients)toast('連線較慢，資料可能還沒到齊')},10000);
  COLS.forEach(c=>{
    if((c==='fees'||c==='bills'||c==='settings'||c==='channels'||c==='plans')&&!isAdmin){loaded[c]=true;return}
    if(isWorker()&&['contacts','assets','contracts','services','log','notify'].includes(c)){loaded[c]=true;return}
    db.collection(c).onSnapshot(snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
      S[c]=o;loaded[c]=true;if(c==='clients')clearTimeout(timer);queue();
    },err=>{loaded[c]=true;if(err&&err.code!=='revoked')toast('讀取 '+c+' 失敗：'+err.message);queue()});
  });
  queue();
}
boot();
})();
/* 手機上隱藏沒填的欄位（—），畫面才不會一整排空白 */
(function(){const mark=()=>document.querySelectorAll('dl.kv dd:not(.nil)').forEach(dd=>{if(dd.textContent.trim()==='—'){dd.classList.add('nil');if(dd.previousElementSibling)dd.previousElementSibling.classList.add('nil')}});
const L=document.getElementById('layer');if(L)new MutationObserver(mark).observe(L,{childList:true,subtree:true});mark()})();
