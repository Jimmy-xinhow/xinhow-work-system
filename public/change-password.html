<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星昊工作管理系統・更改密碼</title>
<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#16202F;--muted:#5B6678;--line:#DCE1EA;--accent:#1F3864;--bad:#B3261E;--ok:#1D7448}
@media (prefers-color-scheme:dark){:root{--bg:#0E1420;--surface:#172030;--ink:#E7ECF4;--muted:#9BA8BC;--line:#2A3649;--accent:#9DBBF2;--bad:#F2958E;--ok:#6FD0A0}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
form{width:min(380px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:18px}p{margin:0;color:var(--muted);font-size:13px}label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:inherit}
button{padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--bg);font:inherit;font-weight:500;cursor:pointer}
@media (prefers-color-scheme:light){button{color:#fff}}button:disabled{opacity:.5}
.link{background:none;color:var(--muted);padding:4px;font-weight:400;font-size:13px;text-decoration:underline}
#e{color:var(--bad);font-size:13px;min-height:1.2em}
@media (max-width:820px){input,select,textarea{font-size:16px}}
</style></head><body>
<form id="f"><div><h1 id="h">更改密碼</h1><p id="why"></p></div>
<div><label for="c">目前的密碼</label><input id="c" type="password" autocomplete="current-password" required></div>
<div><label for="n">新密碼（至少 10 個字元）</label><input id="n" type="password" autocomplete="new-password" minlength="10" required></div>
<div><label for="n2">再輸入一次新密碼</label><input id="n2" type="password" autocomplete="new-password" minlength="10" required></div>
<div id="e" role="alert"></div><button id="b">儲存新密碼</button>
<button type="button" class="link" id="skip" hidden>先不改，回系統</button>
<button type="button" class="link" id="out">登出</button></form>
<script>
const $=id=>document.getElementById(id);let me=null;
(async()=>{const r=await fetch('/api/me');if(r.status===401){location.href='/login';return}me=await r.json();
if(me.mustChange){$('why').textContent='你好，'+me.display+'。這是第一次登入（或密碼剛被管理者重設），請先設定只有你自己知道的新密碼，才能使用系統。'}
else{$('why').textContent='更改 '+me.display+'（'+me.name+'）的登入密碼。改完後其他裝置會被登出。';$('skip').hidden=false}})();
$('skip').onclick=()=>{location.href='/'};
$('out').onclick=async()=>{await fetch('/api/logout',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});location.href='/login'};
$('f').onsubmit=async e=>{e.preventDefault();$('e').textContent='';
if($('n').value!==$('n2').value){$('e').textContent='兩次輸入的新密碼不一樣';return}
$('b').disabled=true;
const r=await fetch('/api/password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({current:$('c').value,next:$('n').value})});
if(r.ok){location.href='/'}else{const j=await r.json().catch(()=>({}));$('e').textContent=j.error||'儲存失敗';$('b').disabled=false}};
</script></body></html>
