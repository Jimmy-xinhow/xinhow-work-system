<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>星昊工作管理系統・帳號管理</title>
<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#16202F;--muted:#5B6678;--line:#DCE1EA;--accent:#1F3864;--bad:#B3261E;--ok:#1D7448;--warn:#8A5A00}
@media (prefers-color-scheme:dark){:root{--bg:#0E1420;--surface:#172030;--ink:#E7ECF4;--muted:#9BA8BC;--line:#2A3649;--accent:#9DBBF2;--bad:#F2958E;--ok:#6FD0A0;--warn:#E8B964}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
main{max-width:760px;margin:0 auto;display:grid;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:grid;gap:12px}
h1{margin:0;font-size:18px}h2{margin:0;font-size:15px}p{margin:0;color:var(--muted);font-size:13px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:inherit;font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media (max-width:560px){.grid{grid-template-columns:1fr}}
button{padding:8px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--bg)}@media (prefers-color-scheme:light){button.pri{color:#fff}}
button.danger{color:var(--bad)}button:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.u{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}.u:first-of-type{border-top:0;padding-top:0}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);margin-left:6px}
.tag.w{color:var(--warn);border-color:var(--warn)}.tag.b{color:var(--bad);border-color:var(--bad)}
#m{min-height:1.4em;font-size:14px}.bad{color:var(--bad)}.ok{color:var(--ok)}a{color:var(--accent)}
.pw{display:flex;gap:8px}.pw input{flex:1}
code{background:var(--bg);padding:1px 6px;border-radius:4px;border:1px solid var(--line)}
</style></head><body><main>
<div class="card"><div class="row"><h1>帳號管理</h1><span style="margin-left:auto"><a href="/">回系統</a></span></div>
<p>只有管理者看得到這一頁。新增或重設密碼後，對方第一次登入必須自己改成新密碼，所以你只需要把臨時密碼私下告訴他。</p><div id="m" role="status"></div></div>

<div class="card"><h2>新增員工帳號</h2>
<form id="add" class="grid" autocomplete="off">
<div><label for="an">帳號（英文小寫、數字）</label><input id="an" required pattern="[a-z0-9._\-]{2,32}" autocapitalize="none" placeholder="例如 amy"></div>
<div><label for="ad">顯示名稱</label><input id="ad" required maxlength="40" placeholder="例如 Amy"></div>
<div><label for="ar">角色</label><select id="ar"><option value="worker">僅交付（只看得到指派給自己的任務、SOP、自己的待辦；看不到也改不了客戶資料）</option><option value="staff">員工（看得到客戶資料，看不到費用、帳款、設定，不能驗收；只看自己的任務）</option><option value="admin">管理者（全部權限）</option></select></div>
<div><label for="ap">臨時密碼（至少 10 字元）</label><div class="pw"><input id="ap" required minlength="10" autocomplete="off"><button type="button" id="gen">產生</button></div></div>
<div style="grid-column:1/-1"><button class="pri" id="ab">建立帳號</button></div></form></div>

<div class="card" id="list"><h2>目前帳號</h2><div id="us"></div></div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const msg=(t,ok)=>{$('m').className=ok?'ok':'bad';$('m').textContent=t};
async function api(method,url,body){const r=await fetch(url,{method,headers:body!==undefined?{'Content-Type':'application/json'}:undefined,body:body!==undefined?JSON.stringify(body):undefined});
 if(r.status===401){location.href='/login';return new Promise(()=>{})}if(r.status===403){const j=await r.json().catch(()=>({}));if(j.error==='must_change_password'){location.href='/change-password';return new Promise(()=>{})}}
 const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'失敗');return j}
const gen=()=>{const a='abcdefghjkmnpqrstuvwxyz',d='23456789',b=crypto.getRandomValues(new Uint32Array(12));let s='';for(let i=0;i<10;i++)s+=a[b[i]%a.length];return s.slice(0,5)+'-'+s.slice(5)+d[b[10]%d.length]+d[b[11]%d.length]};
$('gen').onclick=()=>{$('ap').value=gen()};
const fmt=t=>t?new Date(t).toLocaleString('zh-TW',{hour12:false}):'從未登入';
const RN={admin:'管理者',staff:'員工',worker:'僅交付'};
let me=null,users=[];
async function load(){me=await api('GET','/api/me');users=await api('GET','/api/admin/users');
 $('us').innerHTML=users.map(u=>{const self=u.name===me.name;
 return `<div class="u" data-n="${esc(u.name)}"><div><b>${esc(u.display)}</b> <span style="color:var(--muted)">（${esc(u.name)}）</span>
 <span class="tag">${RN[u.role]||u.role}</span>${self?'<span class="tag">你自己</span>':''}${u.disabled?'<span class="tag b">已停用</span>':''}${u.must_change&&!u.disabled?'<span class="tag w">尚未改密碼</span>':''}</div>
 <p>最後登入：${esc(fmt(u.last_login))}</p>
 <div class="row"><button data-a="name">改顯示名稱</button><button data-a="reset">重設密碼</button>
 ${self?'':`<select data-role aria-label="角色" style="width:auto"><option value="admin" ${u.role==='admin'?'selected':''}>管理者</option><option value="staff" ${u.role==='staff'?'selected':''}>員工</option><option value="worker" ${u.role==='worker'?'selected':''}>僅交付</option></select><button data-a="dis">${u.disabled?'重新啟用':'停用'}</button><button class="danger" data-a="del">刪除</button>`}</div></div>`}).join('')}
$('us').onclick=async e=>{const b=e.target.closest('button[data-a]');if(!b)return;const n=b.closest('.u').dataset.n,u=users.find(x=>x.name===n),a=b.dataset.a;msg('');
 try{
 if(a==='name'){const v=prompt('新的顯示名稱',u.display);if(v===null)return;await api('PATCH','/api/admin/users/'+encodeURIComponent(n),{display:v});msg('已更新','1')}
 else if(a==='reset'){const v=prompt('為 '+u.display+' 設定新的臨時密碼（至少 10 字元，對方登入後會被要求再改）。\n按確定使用下面這組，也可以自己改：',gen());if(v===null)return;await api('PATCH','/api/admin/users/'+encodeURIComponent(n),{newPassword:v});msg(u.display+' 的臨時密碼已設定為 '+v+'（請私下告訴他，他所有裝置都已登出）',1)}
 else if(a==='dis'){if(!u.disabled&&!confirm('停用 '+u.display+'？他會立刻被登出，也無法再登入。資料與任務都保留。'))return;await api('PATCH','/api/admin/users/'+encodeURIComponent(n),{disabled:!u.disabled});msg(u.disabled?'已重新啟用':'已停用',1)}
 else if(a==='del'){if(!confirm('刪除 '+u.display+' 的帳號？這個動作無法復原。只想讓他不能登入的話，請用「停用」，指派給他的任務才不會失去負責人名稱。'))return;await api('DELETE','/api/admin/users/'+encodeURIComponent(n));msg('已刪除',1)}
 await load()}catch(x){msg(x.message)}};
$('us').onchange=async e=>{const s=e.target.closest('select[data-role]');if(!s)return;const n=s.closest('.u').dataset.n,u=users.find(x=>x.name===n);msg('');
 if(!confirm('把 '+u.display+' 改成「'+RN[s.value]+'」？'))return load();
 try{await api('PATCH','/api/admin/users/'+encodeURIComponent(n),{role:s.value});msg('已更新',1)}catch(x){msg(x.message)}await load()};
$('add').onsubmit=async e=>{e.preventDefault();msg('');$('ab').disabled=true;const pw=$('ap').value;
 try{await api('POST','/api/admin/users',{name:$('an').value.trim().toLowerCase(),display:$('ad').value,role:$('ar').value,password:pw});
 msg('已建立 '+$('an').value+'，臨時密碼是 '+pw+'（請私下告訴他，第一次登入會要求他自己改密碼）',1);$('add').reset();await load()}catch(x){msg(x.message)}$('ab').disabled=false};
load().catch(x=>msg(x.message));
</script></body></html>
