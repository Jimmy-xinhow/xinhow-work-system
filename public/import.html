<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>匯入資料</title>
<style>
:root{--bg:#F3F5F9;--surface:#fff;--ink:#16202F;--muted:#5B6678;--line:#DCE1EA;--accent:#1F3864;--bad:#B3261E;--ok:#1D7448}
@media (prefers-color-scheme:dark){:root{--bg:#0E1420;--surface:#172030;--ink:#E7ECF4;--muted:#9BA8BC;--line:#2A3649;--accent:#9DBBF2;--bad:#F2958E;--ok:#6FD0A0}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;padding:16px}
.box{width:min(480px,100%);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:24px;display:grid;gap:14px}
h1{margin:0;font-size:18px}p{margin:0;color:var(--muted);font-size:14px}input{width:100%}
button{padding:10px;border:0;border-radius:6px;background:var(--accent);color:var(--bg);font:inherit;font-weight:500;cursor:pointer}
@media (prefers-color-scheme:light){button{color:#fff}}button:disabled{opacity:.5}
#m{min-height:1.4em;font-size:14px}.bad{color:var(--bad)}.ok{color:var(--ok)}a{color:var(--accent)}
</style></head><body><div class="box"><h1>匯入資料</h1>
<p>選擇初始資料檔（seed.json）或先前下載的備份檔。同一個文件編號會被覆蓋，其他資料不受影響。</p>
<input type="file" id="f" accept=".json,application/json"><button id="b" disabled>匯入</button><div id="m" role="status"></div><p><a href="/">回系統</a></p></div>
<script>
let data=null;const m=document.getElementById('m'),b=document.getElementById('b');
document.getElementById('f').onchange=async e=>{data=null;b.disabled=true;m.textContent='';const f=e.target.files[0];if(!f)return;
try{data=JSON.parse(await f.text());const n=Object.values(data).reduce((a,c)=>a+Object.keys(c).length,0);m.textContent='讀到 '+Object.keys(data).length+' 個集合、'+n+' 筆文件。';b.disabled=false}catch(x){m.className='bad';m.textContent='不是有效的 JSON 檔'}};
b.onclick=async()=>{b.disabled=true;const r=await fetch('/api/import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json().catch(()=>({}));
if(r.ok){m.className='ok';m.textContent='完成，已匯入 '+j.count+' 筆。'}else{m.className='bad';m.textContent=j.error||'匯入失敗';b.disabled=false}};
</script></body></html>
